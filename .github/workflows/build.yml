name: Build

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VC: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Set version
        run: |
          echo "VC=$((${{ github.run_number }} + 100))" >> $GITHUB_ENV
          echo "VER=2.8.$((${{ github.run_number }} + 100))" >> $GITHUB_ENV

      - name: Keystore
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > keystore.jks
            cat > keystore.properties <<EOF
          storeFile=keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          fi

      - name: Build
        run: ./gradlew :app:assembleDev -Pvc=$VC -Pvn=$VER --stacktrace

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VER" app/build/outputs/apk/dev/app-universal-dev.apk \
            --title "v$VER" --notes "Wave v$VER"
